# YUMS va YUMS Driver iOS ilovalarini (IPA) GitHub'ning macOS serverida yig'ish — Windows'da iOS yig'ib bo'lmaydi.
#   - teg: `ios-…` yoki `release-…` (masalan ios-1.0.0-1) — yig'iladi va (Apple kaliti bo'lsa) TestFlight'ga yuklanadi;
#   - GitHub → Actions → «iOS IPA» → Run workflow (tugma faqat fayl asosiy branch'da bo'lsa ko'rinadi).
# Natija — yig'ilishning «Artifacts» bo'limida: YUMS.ipa va YUMS-Driver.ipa.
#
# Ikki rejim:
#  - Apple kaliti secret'lari bor  → App Store uchun imzolangan IPA (TestFlight / App Store'ga yuklanadi).
#    Imzo: scripts/store/asc_signing.py App Store Connect API orqali vaqtinchalik distribution sertifikati va
#    App Store profilini yaratadi, yig'ilishdan keyin bekor qiladi (qurilma ro'yxati va saqlangan sertifikat kerak emas).
#  - secret'lar yo'q               → imzosiz IPA: iOS loyiha xatosiz yig'ilishini tekshirish uchun. Uni iPhone'ga
#    to'g'ridan-to'g'ri o'rnatib bo'lmaydi (Apple imzosi kerak).
#
# Kerakli repo secret'lari (Settings → Secrets and variables → Actions), App Store Connect → Users and Access →
# Integrations → App Store Connect API → «Admin» rolidagi kalit:
#   APPSTORE_API_KEY_ID      — kalit ID (masalan 2X9R4HXF34)
#   APPSTORE_API_ISSUER_ID   — Issuer ID (sahifaning tepasida, UUID)
#   APPSTORE_API_KEY_P8      — yuklab olingan AuthKey_XXXX.p8 faylining butun matni
#   APPLE_TEAM_ID            — Apple Developer → Membership → Team ID (10 belgi)
# Bundle ID'lar (uz.yums.taxi, uz.yums.driver) Apple Developer'da Push Notifications bilan ro'yxatdan o'tgan bo'lishi kerak.
name: iOS IPA

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "TestFlight'ga yuklash (Apple kaliti secret'lari kerak)"
        type: boolean
        default: false
  # iOS sozlamalari o'zgarganda — loyiha macOS'da yig'ilishini tekshirish (yuklamaydi)
  push:
    tags: ['ios-*', 'release-*']
    branches: [feat/backend-integration, main]
    paths:
      - app.json
      - app.config.js
      - package.json
      - package-lock.json
      - plugins/**
      - locales/**
      - scripts/store/asc_signing.py
      - .github/workflows/ios-ipa.yml

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ipa:
    name: ${{ matrix.title }}
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: passenger
            title: YUMS
            file: YUMS
            bundle: uz.yums.taxi
          - variant: driver
            title: YUMS Driver
            file: YUMS-Driver
            bundle: uz.yums.driver
    env:
      APP_VARIANT: ${{ matrix.variant == 'driver' && 'driver' || '' }}
      EXPO_PUBLIC_API_URL: https://api.yums.uz/api/v1
      EXPO_PUBLIC_STORE: appstore
      ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Rejim va yig'ilish raqami
        run: |
          # App Store har yuklashda kattaroq raqam talab qiladi; Play bilan bir xil sxema (1000 + run raqami)
          echo "APP_BUILD=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          # imzo — faqat teg yoki qo'lda ishga tushirilganda; branch push'i faqat yig'ilishni tekshiradi
          # (har imzolangan yig'ilish vaqtinchalik sertifikat oladi, Apple ularning sonini cheklaydi)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "${GITHUB_REF#refs/tags/}" = "$GITHUB_REF" ]; then
            echo "SIGNED=0" >> "$GITHUB_ENV"; echo "Branch push'i — imzosiz tekshiruv yig'ilishi"
          elif [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ]; then
            # secret'lar joyida va to'g'ri ko'rinishda ekanini tekshirish (qiymatlar chiqarilmaydi)
            bad=""
            [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || bad="$bad APPSTORE_API_KEY_ID (10 ta harf/raqam, masalan QZUABC34D3)"
            [[ "$ASC_ISSUER_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || bad="$bad APPSTORE_API_ISSUER_ID (UUID)"
            [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || bad="$bad APPLE_TEAM_ID (10 ta harf/raqam)"
            case "$ASC_KEY_P8" in *"BEGIN PRIVATE KEY"*"END PRIVATE KEY"*) ;; *) bad="$bad APPSTORE_API_KEY_P8 (.p8 faylning butun matni, BEGIN/END bilan)";; esac
            if [ -n "$bad" ]; then echo "::error::Secret noto'g'ri:$bad"; exit 1; fi
            echo "SIGNED=1" >> "$GITHUB_ENV"; echo "Imzolangan IPA (App Store)"
          else
            echo "SIGNED=0" >> "$GITHUB_ENV"
            echo "::warning::Apple kaliti secret'lari yo'q — imzosiz IPA yig'iladi (faqat tekshiruv uchun)"
          fi
          xcodebuild -version

      - name: Kutubxonalar
        run: npm ci

      - name: Native iOS loyiha (expo prebuild + CocoaPods)
        run: |
          npx expo prebuild -p ios --clean --no-install
          cd ios && pod install
          cd .. && ws=$(ls -d ios/*.xcworkspace | head -1)
          echo "WORKSPACE=$ws" >> "$GITHUB_ENV"
          echo "SCHEME=$(basename "$ws" .xcworkspace)" >> "$GITHUB_ENV"

      - name: Imzo (vaqtinchalik sertifikat va profil)
        if: env.SIGNED == '1'
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          key=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
          export ASC_KEY_PATH="$key"
          pip install --quiet pyjwt cryptography
          sign="$RUNNER_TEMP/signing"
          python scripts/store/asc_signing.py create --bundle "${{ matrix.bundle }}" --out "$sign"
          profile_name=$(python -c "import json;print(json.load(open('$sign/ids.json'))['profileName'])")
          profile_uuid=$(python -c "import json;print(json.load(open('$sign/ids.json'))['uuid'])")
          echo "PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"

          # vaqtinchalik keychain: kalit + sertifikat (+ Apple WWDR oraliq sertifikati)
          kc="$RUNNER_TEMP/yums-signing.keychain-db"
          kcpw=$(uuidgen)
          echo "KEYCHAIN=$kc" >> "$GITHUB_ENV"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          /usr/bin/openssl pkcs12 -export -inkey "$sign/key.pem" -in "$sign/cert.pem" -out "$sign/cert.p12" -passout pass:"$kcpw"
          security import "$sign/cert.p12" -k "$kc" -P "$kcpw" -T /usr/bin/codesign -T /usr/bin/security
          curl -sSfL -o "$sign/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer && security import "$sign/wwdr.cer" -k "$kc" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc"
          rm -f "$sign/key.pem" "$sign/cert.p12"

          # profil — Xcode ikkala joydan qidiradi
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir" && cp "$sign/profile.mobileprovision" "$dir/$profile_uuid.mobileprovision"
          done

          # faqat ilova target'i qo'lda imzolanadi (Pods target'lariga profil berib bo'lmaydi)
          ruby -e 'require "xcodeproj"' 2>/dev/null || gem install xcodeproj --no-document
          ruby -e '
            require "xcodeproj"
            proj = Xcodeproj::Project.open(Dir["ios/*.xcodeproj"].first)
            target = proj.targets.find { |t| t.name == ENV["SCHEME"] } ||
                     proj.targets.find { |t| t.product_type == "com.apple.product-type.application" }
            target.build_configurations.each do |c|
              next unless c.name == "Release"
              s = c.build_settings
              s["CODE_SIGN_STYLE"] = "Manual"
              s["DEVELOPMENT_TEAM"] = ENV["APPLE_TEAM_ID"]
              s["CODE_SIGN_IDENTITY"] = "Apple Distribution"
              s["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "Apple Distribution"
              s["PROVISIONING_PROFILE_SPECIFIER"] = ENV["PROFILE_NAME"]
            end
            attrs = (proj.root_object.attributes["TargetAttributes"] ||= {})
            (attrs[target.uuid] ||= {})["ProvisioningStyle"] = "Manual"
            proj.save
            puts "Imzo: #{target.name} → #{ENV["PROFILE_NAME"]}"
            # Pods ichidagi resurs to'plamlari (bundle) imzolanmaydi — aks holda «requires a development team»
            pods = Xcodeproj::Project.open("ios/Pods/Pods.xcodeproj")
            pods.targets.each do |t|
              next unless t.respond_to?(:product_type) && t.product_type == "com.apple.product-type.bundle"
              t.build_configurations.each { |c| c.build_settings["CODE_SIGNING_ALLOWED"] = "NO" }
            end
            pods.save
          '

      - name: Archive
        run: |
          set -o pipefail
          archive="$RUNNER_TEMP/app.xcarchive"
          if [ "$SIGNED" = 1 ]; then
            xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
              -destination 'generic/platform=iOS' -archivePath "$archive" archive \
              OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" > "$RUNNER_TEMP/archive.log" 2>&1 || status=$?
          else
            xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
              -destination 'generic/platform=iOS' -archivePath "$archive" archive \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > "$RUNNER_TEMP/archive.log" 2>&1 || status=$?
          fi
          tail -n 60 "$RUNNER_TEMP/archive.log"
          if [ "${status:-0}" != 0 ] || [ ! -d "$archive/Products/Applications" ]; then
            # Xcode xatolari yig'ilish xulosasiga (annotation) chiqadi
            grep -E "error:|error \[|\*\* ARCHIVE FAILED" "$RUNNER_TEMP/archive.log" | sort -u | head -15 | sed 's/^/::error::/'
            exit 1
          fi

      - name: IPA
        run: |
          set -o pipefail
          archive="$RUNNER_TEMP/app.xcarchive"
          out="$RUNNER_TEMP/export"
          mkdir -p "$out"
          if [ "$SIGNED" = 1 ]; then
            cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>${{ matrix.bundle }}</key><string>$PROFILE_NAME</string>
            </dict>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
            xcodebuild -exportArchive -archivePath "$archive" -exportPath "$out" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" > "$RUNNER_TEMP/export.log" 2>&1 || {
                tail -n 40 "$RUNNER_TEMP/export.log"; grep -E "error:|error " "$RUNNER_TEMP/export.log" | sort -u | head -10 | sed 's/^/::error::/'; exit 1; }
            tail -n 15 "$RUNNER_TEMP/export.log"
            mv "$out"/*.ipa "${{ matrix.file }}.ipa"
          else
            mkdir -p "$out/Payload"
            cp -R "$archive"/Products/Applications/*.app "$out/Payload/"
            (cd "$out" && zip -qry "$GITHUB_WORKSPACE/${{ matrix.file }}-unsigned.ipa" Payload)
          fi
          ls -la *.ipa

      # Do'kon qoidalariga zid narsa ilovaga tushmasin: paket nomi, ruxsat matnlari, privacy manifest
      - name: Tekshiruv
        run: |
          app=$(ls -d "$RUNNER_TEMP"/app.xcarchive/Products/Applications/*.app | head -1)
          plist="$app/Info.plist"
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          echo "Paket: $id · versiya $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist"))"
          [ "$id" = "${{ matrix.bundle }}" ] || { echo "::error::paket nomi ${{ matrix.bundle }} emas"; exit 1; }
          plutil -p "$plist" | grep -E "UsageDescription|ITSAppUsesNonExemptEncryption|UIBackgroundModes" || true
          for bad in NSMicrophoneUsageDescription NSLocationAlwaysUsageDescription NSLocationAlwaysAndWhenInUseUsageDescription NSMotionUsageDescription NSContactsUsageDescription; do
            if /usr/libexec/PlistBuddy -c "Print :$bad" "$plist" >/dev/null 2>&1; then echo "::error::$bad bor — ilova uni ishlatmaydi, Apple rad etadi"; exit 1; fi
          done
          if plutil -p "$plist" | grep -q 'Allow \$(PRODUCT_NAME)'; then echo "::error::Umumiy (shablon) ruxsat matni qolgan"; exit 1; fi
          ls -d "$app"/*.lproj 2>/dev/null || true
          for lang in uz ru; do cat "$app/$lang.lproj/InfoPlist.strings" 2>/dev/null | head -3 || echo "::warning::$lang.lproj/InfoPlist.strings yo'q"; done
          test -f "$app/PrivacyInfo.xcprivacy" && echo "PrivacyInfo.xcprivacy bor" || { echo "::error::PrivacyInfo.xcprivacy yo'q"; exit 1; }
          if [ "$SIGNED" = 1 ]; then codesign -dv --verbose=2 "$app" 2>&1 | grep -E "Authority|TeamIdentifier" | head -3; fi

      # IPA TestFlight'ga yuklashdan oldin saqlanadi — yuklash yiqilsa ham fayl qoladi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}-ipa
          path: ${{ matrix.file }}*.ipa
          retention-days: 30

      - name: TestFlight'ga yuklash
        # qo'lda — belgi bilan; teg bilan — har doim (branch push'ida yuklanmaydi)
        if: env.SIGNED == '1' && ((github.event_name == 'workflow_dispatch' && inputs.upload) || startsWith(github.ref, 'refs/tags/'))
        run: |
          xcrun altool --upload-app -f "${{ matrix.file }}.ipa" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Imzoni tozalash
        if: always() && env.SIGNED == '1'
        run: |
          if [ -f "$RUNNER_TEMP/signing/ids.json" ] && [ -n "${ASC_KEY_PATH:-}" ]; then
            python scripts/store/asc_signing.py cleanup --ids "$RUNNER_TEMP/signing/ids.json" || echo "::warning::Vaqtinchalik sertifikat bekor qilinmadi — Apple Developer → Certificates'dan qo'lda bekor qiling"
          fi
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf ~/.appstoreconnect/private_keys "$RUNNER_TEMP/signing"
